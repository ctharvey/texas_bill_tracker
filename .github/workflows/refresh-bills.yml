name: Refresh Texas bill data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: write
concurrency:
  group: texas-bill-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser tests
        run: python -m unittest discover -s tests -v
      - name: Import official Texas bulk FTP
        run: python scripts/sync_ftp.py
      - name: Commit snapshot only if changed
        run: |
          git config user.name "texas-bill-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bills.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh official 90R bill history"
            git push
          fi
