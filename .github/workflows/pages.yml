name: Publish tracker to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS and Python tests
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -v
      - name: Prepare static bundle
        run: |
          mkdir -p dist/src dist/data
          cp index.html dist/index.html
          cp src/*.js src/*.css dist/src/
          cp data/bills.json dist/data/bills.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
