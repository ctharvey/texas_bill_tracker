name: Tests
# Parity gate for the feature-folders refactor: unit tests, pipeline goldens and the browser E2E suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python test dependencies
        run: python -m pip install pytest==9.0.3 -r requirements-extraction.txt
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests and pipeline goldens
        run: python -m pytest -q tests

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install pytest==9.0.3 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser E2E (src and bundle, desktop and phone)
        env:
          TBA_E2E: '1'
        run: python -m pytest -q tests/e2e
