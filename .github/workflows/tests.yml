name: Tests
# Unit tests and pipeline goldens run on every push and pull request. The browser E2E suite (four ~42 min shards)
# runs only on the nightly schedule, or when started by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * *'  # nightly, 08:00 UTC (2-3 am in Texas)
  workflow_dispatch:
concurrency:
  # The nightly run has its own group so a push to main cannot cancel it.
  group: tests-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'change' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'  # goldens: html.parser output differs across 3.12 patch releases
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python test dependencies
        run: python -m pip install pytest==9.0.3 -r requirements-extraction.txt
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Python tests and pipeline goldens
        run: python -m pytest -q tests

  e2e:
    name: e2e (${{ matrix.mode }}, ${{ matrix.viewport }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # ~42 min serial; tests run on every core (pytest-xdist)
    strategy:
      fail-fast: false
      matrix:
        mode: [src, bundle]
        viewport: [desktop, phone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'  # goldens: html.parser output differs across 3.12 patch releases
      - name: Install Playwright
        run: |
          python -m pip install pytest==9.0.3 pytest-xdist==3.8.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser E2E (every test at this mode and size)
        env:
          TBA_E2E: '1'
          TBA_E2E_MODE: ${{ matrix.mode }}
          TBA_E2E_VIEWPORTS: ${{ matrix.viewport }}
        run: python -m pytest -q -n auto tests/e2e
