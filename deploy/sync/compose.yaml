# Private sync links service. The shared gateway proxies bills.ctharvey.me/api/sync* to bills-sync:8787 over
# edge-bills (cth.hosting). Values come from sync.env next to the deployed copy; none of them are secrets.
name: texas-bill-sync

services:
  sync:
    image: ${PYTHON_IMAGE:?Set the pinned python image digest}
    container_name: texas-bill-sync
    user: ${SYNC_USER:?Set uid:gid of texas-bill-atlas}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # ThreadingHTTPServer starts one thread per request, so pids_limit caps concurrent requests. Python's GIL keeps
    # it near one core, so more than 1 CPU buys little.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    working_dir: /app
    # SYNC_APP holds the whole scripts/ folder of one commit (README: Update); this path and that layout change together.
    command: [python3, /app/scripts/sync_service.py, --db, /data/sync.sqlite3, --snapshot, /live/bills.json,
              --search-data, /live/agent/data/bills.json, --tags, /live/luna/tags.json,
              --host, 0.0.0.0, --port, '8787', --trust-proxy]
    volumes:
      - type: bind
        source: ${SYNC_APP:?Set the extracted application directory}
        target: /app
        read_only: true
      - type: bind
        source: /var/lib/texas-bill-atlas/sync
        target: /data
      - type: bind
        source: /var/www/html/texas-bill-atlas/live
        target: /live
        read_only: true
    networks:
      edge:
        aliases: [bills-sync]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/sync/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
    name: edge-bills
